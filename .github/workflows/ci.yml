name: Extension Checks

on:
  push:
    branches:
      - staging
      - trying
      - main
  pull_request:
    branches:
      - staging
      - trying
      - main

jobs:
  fmt:
    name: Rust and Angular server checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
          target: wasm32-wasip2

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: |
            managed-server/package-lock.json
            tests/package-lock.json

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --locked --target wasm32-wasip2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Install managed stack and test fixtures
        run: |
          npm ci --prefix managed-server --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund

      - name: Test Angular compatibility and offline startup
        run: cargo test --locked managed_server_runtime -- --ignored --nocapture
